<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komang | Career Hub</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: url('https://images.unsplash.com/photo-1557683316-973673baf926') no-repeat center center/cover;
}

/* overlay biar text kebaca */
.overlay {
  background: rgba(0,0,0,0.5);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* card */
.container {
  width: 360px;
  background: rgba(255,255,255,0.95);
  border-radius: 20px;
  padding: 30px 25px;
  text-align: center;
}

/* profile */
.profile-img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 15px;
}

h1 {
  margin: 5px 0;
}

p {
  color: #666;
  margin-bottom: 20px;
}

/* GRID 2 KOLOM */
.links {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* tombol */
.link {
  text-decoration: none;
  background: #111;
  color: white;
  padding: 14px 10px;
  border-radius: 12px;
  font-size: 14px;
  transition: 0.2s;
}

.link:hover {
  background: #333;
  transform: translateY(-2px);
}

/* tombol full */
.full {
  grid-column: span 2;
}

.footer {
  margin-top: 15px;
  font-size: 12px;
  color: #aaa;
}
</style>

</head>
<body>

<div class="overlay">

  <div class="container">

    <img src="https://via.placeholder.com/150" class="profile-img">

    <h1>Komang</h1>
    <p>Your Career, One Step Ahead</p>

    <div class="links">
      <a href="#" class="link">🚀 Apply</a>
      <a href="#" class="link">📄 CV</a>

      <a href="#" class="link">🎥 YouTube</a>
      <a href="#" class="link">💼 LinkedIn</a>

      <a href="#" class="link full">🌐 Portfolio Website</a>
    </div>

    <div class="footer">
      Build your future with intention
    </div>

  </div>

</div>

</body>
</html>
