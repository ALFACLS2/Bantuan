<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Guide</title>

<style>

/* ================= CONFIG ================= */
:root {
  --bg-image: url('https://res.cloudinary.com/dprt1m1wl/image/upload/v1774676745/ChatGPT_Image_Mar_28_2026_12_44_07_PM_uiti48.png');
  --profile-image: url('https://res.cloudinary.com/dprt1m1wl/image/upload/v1774676745/ChatGPT_Image_Mar_28_2026_12_44_07_PM_uiti48.png');
}

/* ================= BASE ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0d0d0d;
  overflow: hidden;
}

/* ================= BACKGROUND ================= */
.bg {
  position: absolute;
  width: 100%;
  height: 100%;
  background: var(--bg-image) center/cover;
  filter: blur(14px) brightness(0.45);
  transform: scale(1.1);
}

/* ================= CARD ================= */
.card {
  width: 360px;
  border-radius: 25px;
  padding: 15px;
  color: white;

  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(25px);

  border: 1px solid rgba(255,255,255,0.1);
}

/* ================= HERO ================= */
.hero {
  height: 240px;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 15px;
}

.hero-img {
  width: 100%;
  height: 100%;
  background: var(--profile-image) center/cover;
  filter: grayscale(100%);
}

/* ================= TEXT ================= */
h1 {
  font-size: 22px;
  margin-bottom: 5px;
}

.sub {
  font-size: 13px;
  opacity: 0.7;
  margin-bottom: 15px;
}

/* ================= BUTTON ================= */
.btn {
  display: block;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 10px;
  text-align: center;
  text-decoration: none;
  color: white;

  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);

  transition: all 0.25s ease;
}

.btn:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.03);
}

.primary {
  background: linear-gradient(90deg, #ff7a18, #ff3d81);
  border: none;
}

/* ================= SEPARATOR ================= */
.separator {
  height: 1px;
  background: rgba(255,255,255,0.1);
  margin: 15px 0;
}

/* ================= SOCIAL ================= */
.social {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.social .btn,
.social a {
  display: flex;
  justify-content: center;
  align-items: center;

  height: 48px;
  border-radius: 12px;

  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);

  text-decoration: none;
  color: white;

  transition: all 0.25s ease;
}

.social .btn:hover,
.social a:hover {
  background: rgba(255,255,255,0.15);
  transform: scale(1.05);
}

.social .btn.active {
  background: linear-gradient(90deg, #ff7a18, #ff3d81);
}

/* ================= ICON ================= */
.icon {
  width: 16px;
  margin-right: 6px;
}

/* ================= FOOTER ================= */
.footer {
  margin-top: 15px;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.08);

  text-align: center;
  font-size: 11px;
  opacity: 0.7;
}

.creator-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;

  margin-top: 5px;
  text-decoration: none;
  color: white;
  font-size: 11px;
  opacity: 0.7;
  transition: 0.2s;
}

.creator-link:hover {
  opacity: 1;
}

/* IG ICON */
.ig-icon {
  width: 14px;
}

/* ================= ANIMATION ================= */
@keyframes clickPop {
  0% { transform: scale(1); }
  50% { transform: scale(0.95); }
  100% { transform: scale(1); }
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="card">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-img"></div>
  </div>

  <!-- TEXT -->
  <h1>Start Your Career</h1>
  <div class="sub">
    Ikuti langkah berikut untuk melamar kerja
  </div>

  <!-- STEP -->
  <a href="https://alfakarir.alfamart.co.id/register" target="_blank" class="btn primary">
    🚀 Step 1: Register Account
  </a>

  <a href="https://alfakarir.alfamart.co.id/vacancy?filter=true&branch=cileungsi2&idb=ZlFwT3pUaVBqWmNQU2poOXVUazlnZz09" target="_blank" class="btn">
    📄 Step 2: Apply Job
  </a>

  <!-- SEPARATOR -->
  <div class="separator"></div>

  <!-- SOCIAL -->
  <div class="social">

    <button class="btn" onclick="openFAQ(this)">
      ❓ FAQ
    </button>

    <a href="https://www.tiktok.com" target="_blank">
      <svg class="icon" viewBox="0 0 24 24" fill="white">
        <path d="M12 2v14.5a3.5 3.5 0 1 1-3.5-3.5c.3 0 .6 0 .9.1V9.6a7 7 0 1 0 7 7V8.3c1.1.9 2.4 1.5 3.9 1.6V6.3c-2-.1-3.9-1.6-4.5-3.8H12z"/>
      </svg>
      TikTok
    </a>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div>Powered by <strong>REC CLS 2</strong></div>

    <a href="https://www.linkedin.com/in/anggoro404/" target="_blank" class="creator-link">
      
      <svg class="ig-icon" viewBox="0 0 24 24" fill="white">
        <path d="M7 2C4.2 2 2 4.2 2 7v10c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5V7c0-2.8-2.2-5-5-5H7zm10 2c1.7 0 3 1.3 3 3v10c0 1.7-1.3 3-3 3H7c-1.7 0-3-1.3-3-3V7c0-1.7 1.3-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2.2A2.8 2.8 0 1112 17a2.8 2.8 0 010-5.6z"/>
      </svg>

      404._.anggoro
    </a>

  </div>

</div>

<script>
function openFAQ(btn) {
  btn.classList.add("active");

  setTimeout(() => {
    btn.classList.remove("active");
    alert("FAQ Coming Soon 😏");
  }, 200);
}
</script>

</body>
</html>
